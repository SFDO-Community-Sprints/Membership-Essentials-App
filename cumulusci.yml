minimum_cumulusci_version: '3.9.1'
project:
    name: Membership-Management
    package:
        name:  Membership-Management
        api_version: '62.0'
    source_format: sfdx

tasks:
    robot:
        options:
            suites: robot/Membership-Management/tests
            options:
                outputdir: robot/Membership-Management/results

    robot_testdoc:
        options:
            path: robot/Membership-Management/tests
            output: robot/Membership-Management/doc/Membership-Management_tests.html

    setup_pricebook:
        group: Membership-Management
        description: Activates the Standard Price Book, ensures the sample membership products exist, and creates their standard price book entries.
        class_path: cumulusci.tasks.apex.anon.AnonymousApexTask
        options:
            path: scripts/apex/setup_pricebook.apex

flows:
    config_dev:
        description: Customized flow used in the default dev org flow for setting up a development environment.
        steps:
            3:
                task: assign_permission_sets
                options:
                    api_names: Membership_Manage
            4:
                task: deploy_post
                options:
                    path: unpackaged/dev
            95:
                task: setup_pricebook
    config_qa:
        steps:
            3:
                task: assign_permission_sets
                options:
                    api_names: Membership_Manage
            95:
                task: setup_pricebook
