Insert Membership_Form_Submission__c:
  sf_object: Membership_Form_Submission__c
  table: Membership_Form_Submission__c
  fields:
  # Status must be Imported at insert. The AFTER-MFS-auditor flow fires on create
  # and update unless status is Imported or Failed, and would otherwise re-run the
  # whole intake pipeline against every row in this dataset.
  - Status__c
  - Membership_Finder_Ran__c
  - Term_Start_Date__c
  - SalePrice__c
  - Duration__c
  - MembershipType__c
  - Source_Code__c
  lookups:
    Membership__c:
      table: Membership__c
      key_field: Membership__c
    Account__c:
      table: Account
      key_field: Account__c
    Product__c:
      table: Product2
      key_field: Product__c
