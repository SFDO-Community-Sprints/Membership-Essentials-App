# Editing this file is usually not recommended because it will
# be overwritten the next time you re-capture this data.
#
# You can change this file's contents permanently by creating a
# .load.yml file and re-capturing:
#
#  https://cumulusci.readthedocs.io/en/stable/data.html#extracting-and-loading-sample-datasets
Insert Product2:
  sf_object: Product2
  table: Product2
  fields:
  - Description
  - DisplayUrl
  - ExternalId
  - Family
  - Grace_Period__c
  - IsActive
  - IsSerialized
  - Membership_Tier__c
  - Name
  - ProductCode
  - QuantityUnitOfMeasure
  - Renewal_Option__c
  - StockKeepingUnit
  - Term_Unit__c
  - Term__c
  lookups:
    Downgrade_Path__c:
      table: Product2
      key_field: Downgrade_Path__c
      after: Insert Product2
    Upgrade_Path__c:
      table: Product2
      key_field: Upgrade_Path__c
      after: Insert Product2
Insert Membership__c:
  sf_object: Membership__c
  table: Membership__c
  fields:
  - Name
  - Type__c
  - Status__c
  - Start_Date__c
  - End_Date__c
  lookups:
    Account__c:
      table: Account
      key_field: Account__c
      after: Insert Account
    Primary_Contact__c:
      table: Contact
      key_field: Primary_Contact__c
      after: Insert Contact
    Product__c:
      table: Product2
      key_field: Product__c
